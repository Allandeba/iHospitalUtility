server {
    listen 80;
    server_name _;

    # Raiz do diretório onde os arquivos do Blazor estão
    root /usr/share/nginx/html;

    # Configuração para servir o index.html para todas as rotas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuração para arquivos estáticos
    location /_framework/ {
        # Cache de arquivos estáticos por uma semana
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Configuração para arquivos .wasm
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Manifestos e bootstrap devem ser revalidados entre publicações.
    location = /_framework/blazor.boot.json {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(pwabuilder-sw\.js|service-worker-assets\.js|pwa-registration\.js|site\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # O precache precisa buscar index.html diretamente com HTTP 200.
    error_page 404 /index.html;
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
